<!-- Small gear used in the middle of gear-divider lines (<hr class="gear-divider">). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <g fill="#F2B705">
    <rect x="10.5" y="1.5" width="3" height="4.5"/>
    <rect x="10.5" y="1.5" width="3" height="4.5" transform="rotate(45 12 12)"/>
    <rect x="10.5" y="1.5" width="3" height="4.5" transform="rotate(90 12 12)"/>
    <rect x="10.5" y="1.5" width="3" height="4.5" transform="rotate(135 12 12)"/>
    <rect x="10.5" y="1.5" width="3" height="4.5" transform="rotate(180 12 12)"/>
    <rect x="10.5" y="1.5" width="3" height="4.5" transform="rotate(225 12 12)"/>
    <rect x="10.5" y="1.5" width="3" height="4.5" transform="rotate(270 12 12)"/>
    <rect x="10.5" y="1.5" width="3" height="4.5" transform="rotate(315 12 12)"/>
  </g>
  <circle cx="12" cy="12" r="6.25" fill="none" stroke="#F2B705" stroke-width="1.5"/>
  <circle cx="12" cy="12" r="2.25" fill="none" stroke="#F2B705" stroke-width="1.5"/>
</svg>
