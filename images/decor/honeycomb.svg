<!-- Faint honeycomb texture used behind the hero, page headers, and footer.
     A few cell edges are slightly brighter "circuit traces" with small solder-pad dots.
     To make the pattern stronger or weaker, change the opacity numbers
     (0 = invisible, 1 = solid). -->
<svg xmlns="http://www.w3.org/2000/svg" width="224" height="300" viewBox="0 0 224 300">
  <defs>
    <g id="cell" fill="none" stroke="#F2B705" stroke-opacity="0.06">
      <path d="M28 66L0 50L0 16L28 0L56 16L56 50L28 66L28 100"/>
      <path d="M28 0L28 34L0 50L0 84L28 100L56 84L56 50L28 34"/>
    </g>
    <g id="row">
      <use href="#cell"/>
      <use href="#cell" x="56"/>
      <use href="#cell" x="112"/>
      <use href="#cell" x="168"/>
    </g>
  </defs>
  <use href="#row"/>
  <use href="#row" y="100"/>
  <use href="#row" y="200"/>
  <!-- circuit traces (only two per tile, so they stay rare) -->
  <g fill="none" stroke="#F2B705" stroke-opacity="0.09" stroke-width="1.2">
    <path d="M28 66L56 50L56 16"/>
    <path d="M168 284L168 250L196 234"/>
  </g>
  <!-- solder pads -->
  <g fill="#F2B705" fill-opacity="0.13">
    <circle cx="28" cy="66" r="2"/>
    <circle cx="56" cy="16" r="2"/>
    <circle cx="168" cy="284" r="2"/>
    <circle cx="196" cy="234" r="2"/>
  </g>
</svg>
